<body>
<div class="wrap">
  <h1>Gaussian Splatting 交互讲解</h1>
  <p class="lead">
    课程里说泼溅体「可以实时渲染」，这一页把这句话拆开：每个泼溅体是 14 个数字的三维高斯，
    渲染就是<b>投影 → 分块 → 排序 → α 混合</b>，而它之所以「对 AI 友好」，是因为整条链都可微。
    本页所有图像都是<b>浏览器里实时光栅化</b>的（不是预渲染图片），核心代码逐行对齐官方 CUDA 实现，
    并与 Python + numpy 参考实现逐位对拍。单文件、零依赖、可离线打开。
  </p>

    <button class="tab" role="tab" aria-selected="true"  data-tab="anatomy">一个泼溅体是什么</button>

    <button class="tab" role="tab" aria-selected="false" data-tab="diff">为什么对 AI 友好</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="fast">为什么快</button>
    <button class="tab" role="tab" aria-selected="false" data-tab="vs">对比与边界</button>
  </div>

  <section id="p-anatomy" class="panel on"></section>
  <section id="p-pipe"    class="panel"></section>

<script>
/* ==========================================================================
   Gaussian Splatting core — single source of truth.
   Semantics follow the official CUDA rasterizer
   (graphdeco-inria/diff-gaussian-rasterization, forward.cu) line by line;
   cross-validated bit-for-bit against a Python + numpy reference build.
   ========================================================================== */
/* ---- constants, all from the official implementation ---- */
const BLOCK = 16; // config.h: BLOCK_X = BLOCK_Y = 16
const LOWPASS = 0.3; // forward.cu: cov[0][0] += 0.3 ; cov[1][1] += 0.3
const ALPHA_CAP = 0.99; // forward.cu: alpha = min(0.99f, ...)
const ALPHA_MIN = 1 / 255; // forward.cu: skip if alpha < 1/255
const T_MIN = 1e-4; // forward.cu: early-out when T*(1-a) < 0.0001
const NEAR_Z = 0.2; // forward.cu: cull if view z <= 0.2
const LIM = 1.3; // forward.cu: clamp x/z, y/z to +-1.3*tanfov
const SH_C0 = 0.28209479177387814; // auxiliary.h
/* ---- quaternion (w,x,y,z) -> rotation matrix, exactly as computeCov3D ---- */
function quatToR(w, x, y, z) {
    return [
        1 - 2 * (y * y + z * z), 2 * (x * y - w * z), 2 * (x * z + w * y),
        2 * (x * y + w * z), 1 - 2 * (x * x + z * z), 2 * (y * z - w * x),
        2 * (x * z - w * y), 2 * (y * z + w * x), 1 - 2 * (x * x + y * y),
    ];
}
/* ---- world -> camera (OpenGL-ish, looks down +z) ---- */
function lookAt(eye, target, up = [0, 0, 1]) {
    const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
    const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    const norm = (a) => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };
    const fwd = norm(sub(target, eye));
    let right = cross(fwd, up);
    if (Math.hypot(right[0], right[1], right[2]) < 1e-8)
        right = cross(fwd, [0, 1, 0]);
    right = norm(right);
    const camup = cross(right, fwd);
    const R = [right[0], right[1], right[2], camup[0], camup[1], camup[2], fwd[0], fwd[1], fwd[2]];
    const t = [
        -(R[0] * eye[0] + R[1] * eye[1] + R[2] * eye[2]),
        -(R[3] * eye[0] + R[4] * eye[1] + R[5] * eye[2]),
        -(R[6] * eye[0] + R[7] * eye[1] + R[8] * eye[2]),
    ];
    return { R, t };
}
function orbitCamera(elevDeg, azimDeg, radius) {
    const e = (elevDeg * Math.PI) / 180;
    const a = (azimDeg * Math.PI) / 180;
    const eye = [radius * Math.cos(e) * Math.sin(a), radius * Math.cos(e) * Math.cos(a), radius * Math.sin(e)];
    return lookAt(eye, [0, 0, 0]);
}
/* ---- project all gaussians; mirrors forward.cu preprocessing ---- */
function project(g, R, t, W, H, fovx, fovy, scaleMod = 1, lowpass = true) {
    const fx = W / (2 * fovx);
    const fy = H / (2 * fovy);
    const gx = Math.ceil(W / BLOCK);
    const gy = Math.ceil(H / BLOCK);
    const out = [];
    const N = g.length / 14;
    for (let i = 0; i < N; i++) {
        const o = i * 14;
        const p = [g[o], g[o + 1], g[o + 2]];
        const opacity = g[o + 3];
        const sx = g[o + 4] * scaleMod, sy = g[o + 5] * scaleMod, sz = g[o + 6] * scaleMod;
        const tv = [
            R[0] * p[0] + R[1] * p[1] + R[2] * p[2] + t[0],
            R[3] * p[0] + R[4] * p[1] + R[5] * p[2] + t[1],
            R[6] * p[0] + R[7] * p[1] + R[8] * p[2] + t[2],
        ];
        if (tv[2] <= NEAR_Z)
            continue;
        const ndcx = (tv[0] / fovx) / tv[2];
        const ndcy = (tv[1] / fovy) / tv[2];
        const px = ((ndcx + 1) * W - 1) * 0.5;
        const py = ((ndcy + 1) * H - 1) * 0.5;
        const tz = tv[2];
        const tx = Math.min(LIM * fovx, Math.max(-LIM * fovx, tv[0] / tz)) * tz;
        const ty = Math.min(LIM * fovy, Math.max(-LIM * fovy, tv[1] / tz)) * tz;
        // J (3x3, row-major), then T = R * J ; cov2d = T^T Sigma T
        const J = [fx / tz, 0, -(fx * tx) / (tz * tz), 0, fy / tz, -(fy * ty) / (tz * tz), 0, 0, 0];
        const Tm = new Array(9).fill(0);
        for (let r = 0; r < 3; r++)
            for (let c = 0; c < 3; c++) {
                let s = 0;
                for (let k = 0; k < 3; k++)
                    s += R[r * 3 + k] * J[k * 3 + c];
                Tm[r * 3 + c] = s;
            }
        const q = [g[o + 7], g[o + 8], g[o + 9], g[o + 10]];
        const Rm = quatToR(q[0], q[1], q[2], q[3]);
        const M = new Array(9).fill(0);
        for (let r = 0; r < 3; r++)
            for (let c = 0; c < 3; c++)
                M[r * 3 + c] = [sx, sy, sz][r] * Rm[r * 3 + c];
        // Sigma = M^T M
        const S3 = new Array(9).fill(0);
        for (let r = 0; r < 3; r++)
            for (let c = 0; c < 3; c++) {
                let s = 0;
                for (let k = 0; k < 3; k++)
                    s += M[k * 3 + r] * M[k * 3 + c];
                S3[r * 3 + c] = s;
            }
        // C2 = Tm^T S3 Tm
        const C2 = new Array(9).fill(0);
        for (let r = 0; r < 3; r++)
            for (let c = 0; c < 3; c++) {
                let s = 0;
                for (let m = 0; m < 3; m++)
                    for (let n = 0; n < 3; n++)
                        s += Tm[m * 3 + r] * S3[m * 3 + n] * Tm[n * 3 + c];
                C2[r * 3 + c] = s;
            }
        let a = C2[0] + LOWPASS, b = C2[1], c = C2[4] + LOWPASS;
        let det = a * c - b * b;
        if (det <= 0)
            continue;
        const mid = 0.5 * (a + c);
        const disc = Math.max(0.1, mid * mid - det);
        const l1 = mid + Math.sqrt(disc);
        const radius = Math.ceil(3 * Math.sqrt(Math.max(l1, mid - Math.sqrt(disc))));
        if (!lowpass) {
            a -= LOWPASS;
            c -= LOWPASS;
            det = a * c - b * b;
            if (det <= 0)
                continue;
        }
        // tile rect, exactly as getRect
        const xmin = Math.min(gx, Math.max(0, Math.floor((px - radius) / BLOCK)));
        const ymin = Math.min(gy, Math.max(0, Math.floor((py - radius) / BLOCK)));
        const xmax = Math.min(gx, Math.max(0, Math.floor((px + radius + BLOCK - 1) / BLOCK)));
        const ymax = Math.min(gy, Math.max(0, Math.floor((py + radius + BLOCK - 1) / BLOCK)));
        out.push({
            idx: i, px, py, depth: tz, a, b, c,
            cx: c / det, cy: -b / det, cz: a / det,
            radius, alpha: opacity,
            r: g[o + 11], g: g[o + 12], bl: g[o + 13],
            tmin: ymin * gx + xmin, tcount: (ymax - ymin) * (xmax - xmin),
        });
    }
    return out;
}
/* ---- rasterize; mirrors renderCUDA ---- */
function rasterize(g, R, t, W, H, fovx, fovy, opt = {}) {
    const tile = opt.tile !== false;
    const sort = opt.sort !== false;
    const cap = opt.cap !== false;
    const amin = opt.amin !== false;
    const early = opt.early !== false;
    const bg = opt.bg ?? [1, 1, 1];
    const proj = project(g, R, t, W, H, fovx, fovy, 1, opt.lowpass !== false);
    const img = new Float64Array(W * H * 3);
    const trans = new Float64Array(W * H);
    const contrib = new Int32Array(W * H);
    for (let i = 0; i < W * H; i++) {
        img[i * 3] = bg[0];
        img[i * 3 + 1] = bg[1];
        img[i * 3 + 2] = bg[2];
        trans[i] = 1;
    }
    const gx = Math.ceil(W / BLOCK), gy = Math.ceil(H / BLOCK);
    const tiles = new Int32Array(gx * gy);
    let entries = 0;
    let blocks;
    if (tile) {
        const buckets = new Array(gx * gy);
        for (let i = 0; i < buckets.length; i++)
            buckets[i] = [];
        for (const pr of proj) {
            const rect = tileRect(pr, gx, gy);
            for (let ty = rect.y0; ty < rect.y1; ty++)
                for (let tx = rect.x0; tx < rect.x1; tx++) {
                    buckets[ty * gx + tx].push(pr);
                    entries++;
                    tiles[ty * gx + tx]++;
                }
        }
        blocks = [];
        for (let ty = 0; ty < gy; ty++)
            for (let tx = 0; tx < gx; tx++)
                if (buckets[ty * gx + tx].length)
                    blocks.push({ x: tx * BLOCK, y: ty * BLOCK, list: buckets[ty * gx + tx] });
        if (sort)
            for (const bk of blocks)
                bk.list.sort((p, q) => p.depth - q.depth || p.idx - q.idx);
    }
    else {
        const list = [...proj];
        if (sort)
            list.sort((p, q) => p.depth - q.depth || p.idx - q.idx);
        entries = list.length;
        blocks = [{ x: 0, y: 0, list }];
    }
    const span = tile ? BLOCK : Math.max(W, H);
    let skipAlpha = 0, skipPower = 0, earlyStops = 0;
    for (const bk of blocks) {
        for (let yy = bk.y; yy < Math.min(bk.y + span, H); yy++) {
            for (let xx = bk.x; xx < Math.min(bk.x + span, W); xx++) {
                let C0 = 0, C1 = 0, C2 = 0, T = 1, last = 0, n = 0;
                for (const pr of bk.list) {
                    n++;
                    const dx = pr.px - xx, dy = pr.py - yy;
                    const power = -0.5 * (pr.cx * dx * dx + pr.cz * dy * dy) - pr.cy * dx * dy;
                    if (power > 0) {
                        skipPower++;
                        continue;
                    }
                    let al = pr.alpha * Math.exp(power);
                    if (cap)
                        al = Math.min(ALPHA_CAP, al);
                    if (amin && al < ALPHA_MIN) {
                        skipAlpha++;
                        continue;
                    }
                    const tT = T * (1 - al);
                    if (early && tT < T_MIN) {
                        earlyStops++;
                        break;
                    }
                    const w = al * T;
                    C0 += pr.r * w;
                    C1 += pr.g * w;
                    C2 += pr.bl * w;
                    T = tT;
                    last = n;
                }
                const id = yy * W + xx;
                img[id * 3] = C0 + T * bg[0];
                img[id * 3 + 1] = C1 + T * bg[1];
                img[id * 3 + 2] = C2 + T * bg[2];
                trans[id] = T;
                contrib[id] = last;
            }
        }
    }
    const stats = opt.stats ? {
        n: g.length / 14, visible: proj.length, entries, brute: (g.length / 14) * W * H,
        radiusMean: proj.length ? proj.reduce((s, p) => s + p.radius, 0) / proj.length : 0,
        radiusMax: proj.length ? Math.max(...proj.map((p) => p.radius)) : 0,
        skipAlpha, skipPower, earlyStops, tiles, tilesW: gx, tilesH: gy,
    } : undefined;
    return { img, trans, contrib, stats };
}
function tileRect(pr, gx, gy) {
    const x0 = Math.min(gx, Math.max(0, Math.floor((pr.px - pr.radius) / BLOCK)));
    const y0 = Math.min(gy, Math.max(0, Math.floor((pr.py - pr.radius) / BLOCK)));
    const x1 = Math.min(gx, Math.max(0, Math.floor((pr.px + pr.radius + BLOCK - 1) / BLOCK)));
    const y1 = Math.min(gy, Math.max(0, Math.floor((pr.py + pr.radius + BLOCK - 1) / BLOCK)));
    return { x0, y0, x1, y1 };
}
/* ---- 2D differentiable splatting (for the "why differentiable" tab) ---- */
const NS = 9; // x y sx sy theta r g b alpha
function render2d(P, W, H, bg, sort, cap, amin) {
    const n = P.length / NS;
    const yy = new Float64Array(H * W), xx = new Float64Array(H * W);
    for (let y = 0; y < H; y++)
        for (let x = 0; x < W; x++) {
            yy[y * W + x] = y;
            xx[y * W + x] = x;
        }
    const alphas = [];
    const order = [];
    for (let i = 0; i < n; i++)
        order.push(i);
    if (sort)
        order.sort((a, b) => P[a * NS + 1] - P[b * NS + 1]);
    const T = new Float64Array(H * W).fill(1);
    const out = new Float64Array(H * W * 3);
    for (let k = 0; k < order.length; k++) {
        const i = order[k];
        const o = i * NS;
        const x = P[o], y = P[o + 1];
        const sx = Math.abs(P[o + 2]), sy = Math.abs(P[o + 3]), th = P[o + 4];
        const ct = Math.cos(th), st = Math.sin(th);
        const a = sx * sx * ct * ct + sy * sy * st * st + LOWPASS;
        const b = (sx * sx - sy * sy) * ct * st;
        const c = sx * sx * st * st + sy * sy * ct * ct + LOWPASS;
        const det = a * c - b * b;
        const cx = c / det, cy = -b / det, cz = a / det;
        const al = new Float64Array(H * W);
        for (let p = 0; p < H * W; p++) {
            const dx = x - xx[p], dy = y - yy[p];
            const power = -0.5 * (cx * dx * dx + cz * dy * dy) - cy * dx * dy;
            let v = P[o + 8] * Math.exp(Math.min(0, power));
            if (cap)
                v = Math.min(ALPHA_CAP, v);
            if (amin && v < ALPHA_MIN)
                v = 0;
            al[p] = v;
        }
        alphas.push(al);
        for (let p = 0; p < H * W; p++) {
            const w = al[p] * T[p];

    </div>
  </div>
  <div class="callout info" style="margin-top:14px">
    <div class="t">Why this is the whole trick — and where it breaks</div>
    Every pixel is a smooth formula of the 9 (×N) parameters, so <code>∂image/∂params</code> exists: gradient descent can
    <i>move, stretch, recolour</i> splats to match photos. The only non-smooth parts are the two α thresholds and the sort order —
    exactly the discrete decisions neural nets hate; here they are few and harmless (gradient is zero across them).
    Now switch init to <b>${D3.n} random</b>: splats that land far from any signal get ≈0 gradient and never move —
    a <b>dead zone</b>. That is precisely why the original paper seeds splats with Structure-from-Motion points and
    keeps <i>densifying / pruning</i> them during training. This page's gradient is analytic, cross-checked against
    finite differences (max rel. error 1.3e-8).
  </div>`;
  p.querySelector("input[data-d=lr]").addEventListener("input", (e) => { D3.lr = Math.pow(10, +e.target.value); RENDER.diff(); });
  p.querySelector("input[data-d=perTick]").addEventListener("input", (e) => { D3.perTick = +e.target.value; RENDER.diff(); });
  p.querySelector("select[data-d=init]").value = D3.init;
  p.querySelector("select[data-d=init]").addEventListener("change", (e) => { D3.init = e.target.value; d3init(false); RENDER.diff(); });
  p.querySelectorAll("input[type=checkbox][data-d]").forEach((c) => c.addEventListener("change", () => {
    D3[c.dataset.d] = c.checked;
    if (c.dataset.d === "sort") D3.T = render2d(D3.GT, FW, FH, [0, 0, 0], D3.sort, D3.cap, D3.amin).img;
    RENDER.diff();
  }));
  p.querySelector("#d3-run").addEventListener("click", () => { D3.running = !D3.running; RENDER.diff(); });
  p.querySelector("#d3-step").addEventListener("click", () => { d3step(1); RENDER.diff(); });
  p.querySelector("#d3-reset").addEventListener("click", () => { d3init(false); RENDER.diff(); });
  p.querySelector("#d3-new").addEventListener("click", () => { d3init(true); RENDER.diff(); });
  p.querySelector("#diff-holder-t").appendChild(cvT);
  p.querySelector("#diff-holder-c").appendChild(cvC);
};
setInterval(() => { if (D3.running && $("#p-diff").classList.contains("on")) { d3step(D3.perTick); RENDER.diff(); } }, 80);

/* ================= tab 4: why fast ================= */
const F4 = { alpha: 0.5 };
RENDER.fast = function () {
  const p = $("#p-fast");
  const rows = MEASURED.tileEfficiency;
  const bw = 460, bh = 196, pad = 46;
  const groups = rows.length;
  const gw = (bw - pad - 10) / groups;
  const lmax = Math.log10(Math.max(...rows.map((r) => r.brute)));
  const bars = rows.map((r, i) => {
    const x0 = pad + i * gw + 8;
    const hB = (Math.log10(r.brute) / lmax) * (bh - 66);
    const hT = (Math.log10(r.tileWrites) / lmax) * (bh - 66);
    return `<g>
      <rect x="${x0}" y="${bh - 34 - hB}" width="26" height="${hB}" fill="var(--fg3)" fill-opacity="0.55"></rect>
      <rect x="${x0 + 30}" y="${bh - 34 - hT}" width="26" height="${hT}" fill="var(--accent)"></rect>
      <text x="${x0 + 13}" y="${bh - 20}" font-size="9.5" fill="var(--fg2)" text-anchor="middle">N=${r.N}</text>
      <text x="${x0 + 43}" y="${bh - 20}" font-size="9.5" fill="var(--fg2)" text-anchor="middle">${r.W}²</text>
      <text x="${x0 + 28}" y="${bh - 38 - hB}" font-size="9" fill="var(--fg3)" text-anchor="middle">${nf(r.brute)}</text>
      <text x="${x0 + 44}" y="${bh - 38 - hT}" font-size="9" fill="var(--accent)" text-anchor="middle">${nf(r.tileWrites)}</text>
    </g>`;
  }).join("");
  const chart = `<svg viewBox="0 0 ${bw} ${bh}" width="100%" role="img" aria-label="tile writes vs brute force, log scale">
    <line x1="${pad}" y1="${bh - 34}" x2="${bw - 6}" y2="${bh - 34}" stroke="var(--line2)"/>
    <text x="4" y="14" font-size="10" fill="var(--fg3)">pixel-splat pairs (log₁₀)</text>
    ${bars}
    <text x="${bw - 6}" y="${bh - 6}" text-anchor="end" font-size="9.5" fill="var(--fg3)">grey = brute force N·W·H · blue = tile writes (measured)</text>
  </svg>`;
  const k = Math.ceil(Math.log(1e-4) / Math.log(1 - Math.min(0.999, F4.alpha)));
  const consts = [
    ["16 × 16", "tile size", "config.h: BLOCK_X / BLOCK_Y; one CUDA block = 256 threads = one tile"],
    ["⌈3σmax", "splat screen radius", "forward.cu: bounding box from the larger eigenvalue; α there ≈ 0.011"],
    ["+0.3", "low-pass on cov2d", "forward.cu: every splat is at least ~1 px wide; kills aliasing of tiny splats"],
    ["0.99", "α cap", "forward.cu: min(0.99f, …); keeps 1−α ≥ 0.01 so T always decays"],
    ["1/255", "α floor", "forward.cu: below one 8-bit level the contribution is invisible → skip"],
    ["1e-4", "transmittance floor", "forward.cu: pixel done once T·(1−α) < 0.0001"],
    ["z ≤ 0.2", "near-plane cull", "forward.cu: splats behind/at the camera are dropped"],
    ["±1.3·tanfov", "Jacobian clamp", "forward.cu: limits the EWA linearisation to the frustum core"],
  ].map(([v, n, s]) => `<tr><td><code>${v}</code></td><td>${n}</td><td style="color:var(--fg2)">${s}</td></tr>`).join("");
  p.innerHTML = `
  <div class="grid2">
    <div class="stack">
      <div class="card"><header>Work avoided by tile bucketing <span class="hint">measured with this page's core</span></header>
        <div class="body">${chart}
          <div class="legend"><span><i style="background:var(--fg3)"></i>brute force: every splat × every pixel</span>
          <span><i style="background:var(--accent)"></i>tile path: only splats whose 3σ box touches the tile</span></div>
        </div></div>
      <div class="card"><header>Where the constants come from</header>
        <div class="body tight"><table><tr><th>value</th><th>name</th><th>source &amp; meaning</th></tr>${consts}</table></div></div>
    </div>
    <div class="stack">
      <div class="card"><header>Early-out arithmetic <span class="hint">why "front-to-back + T" is a terminator</span></header>
        <div class="body stack">
          <label class="ctl"><span>per-splat α = <b>${f2(F4.alpha)}</b></span><input type="range" min="0.05" max="0.99" step="0.01" value="${F4.alpha}" data-f="alpha"></label>
          <div class="kv">After <b>k</b> overlapping splats the transmittance is <code>T = (1−α)^k</code>.
          The pixel stops as soon as <code>T·(1−α) &lt; 1e-4</code>:</div>
          <div class="stats">
            <div class="stat"><div class="v">${k}</div><div class="l">splats until this pixel is opaque enough to stop</div></div>
            <div class="stat"><div class="v">${Math.pow(1 - F4.alpha, k).toExponential(1)}</div><div class="l">T at that point</div></div>
          </div>
          <div class="kv">So a pixel never reads the whole scene — only the handful of splats in front of the first opaque surface.
          Depth-sorting per tile is what makes "front" cheap: one 64-bit key <code>(tileID &lt;&lt; 32) | floatBits(depth)</code>, one radix sort for the whole frame.</div>
        </div></div>
      <div class="card"><header>What the tile path actually skips</header>
        <div class="body stack">
          <div class="kv"><b>1. Outside the 3σ box.</b> α there is ≤ α₀·e⁻⁴·⁵ ≈ 1.1% of α₀ — below the 1/255 floor for any α₀ &lt; 0.36, and visually negligible otherwise.</div>
          <div class="kv"><b>2. Behind opaque stuff.</b> The T &lt; 1e-4 early-out ends the pixel's walk mid-list.</div>
          <div class="kv"><b>3. Off-screen / behind camera.</b> Frustum + z ≤ 0.2 culling before any pixel work.</div>
          <div class="kv"><b>Cost of the trick:</b> a splat touching many tiles is evaluated once per tile (duplicated work at tile borders), and pixels at a 3σ box corner get evaluated then skipped by the α floor. Both are cheap compared to N·W·H.</div>
        </div></div>
    </div>
  </div>`;
  p.querySelector("input[data-f=alpha]").addEventListener("input", (e) => { F4.alpha = +e.target.value; RENDER.fast(); });
};
/* ================= tab 5: comparison & boundaries ================= */
const V5 = { n: 1000000 };
RENDER.vs = function () {
  const p = $("#p-vs");
  const n = V5.n;
  const mb = (b) => (n * b / 1e6).toFixed(1);
  const rows = [
    ["what it stores", "vertices + triangles + (uv, normals)", "implicit field f(x,y,z); mesh only after Marching Cubes", "N independent 3D Gaussians (14–62 numbers each)"],
    ["topology", "explicit connectivity", "none until extracted", "none — ever"],
    ["render", "triangle rasterizer (z-buffer)", "march rays through a network", "alpha-blend sorted splats (this page)"],
    ["real-time today", "yes (the whole ecosystem)", "no for NeRF-class quality", "yes — that is the point"],
    ["trainable by pixels", "hard (discrete topology)", "yes (differentiable ray march)", "yes (differentiable rasterizer)"],
    ["edit / animate", "mature tooling", "hard", "emerging (4DGS, physics hybrids)"],
    ["typical size", "100k tris ≈ 3–10 MB", "MLP 10–100 MB", `${nf(n)} splats: ${mb(56)} MB (LGM 14-float) / ${mb(248)} MB (3DGS .ply)`],
  ].map((r) => `<tr>${r.map((c, i) => `<td${i ? "" : ' style="color:var(--fg2)"'}>${c}</td>`).join("")}</tr>`).join("");
  const sizes = [
    ["LGM runtime (14 floats)", 56, "3 pos + 1 α + 3 scale + 4 rot + 3 rgb — what this page renders"],
    [".splat web format", 32, "pos f32×3 + scale f32×3 + rgba u8×4 + rot u8×4 (antimatter15/splat)"],
    ["3DGS trained params", 236, "3 pos + 48 SH(deg 3) + 1 α + 3 scale + 4 rot = 59 floats"],
    ["3DGS .ply on disk", 248, "the 59 trained + 3 unused normals (legacy PLY header)"],
  ].map(([nm, b, s]) => `<tr><td>${nm}</td><td class="num">${b}</td><td class="num">${mb(b)}</td><td style="color:var(--fg2)">${s}</td></tr>`).join("");
  p.innerHTML = `
  <div class="card"><header>Three ways to say "a 3D thing"</header>
    <div class="body tight"><table>
      <tr><th></th><th>mesh</th><th>NeRF / implicit field</th><th>Gaussian splats</th></tr>${rows}
    </table></div></div>
  <div class="grid2" style="margin-top:16px">
    <div class="card"><header>Bytes per splat <span class="hint">slider = ${nf(n)} splats</span></header>
      <div class="body stack">
        <label class="ctl"><span>N = <b>${nf(n)}</b></span><input type="range" min="3" max="7.3" step="0.05" value="${Math.log10(n)}" data-v="n"></label>
        <table><tr><th>format</th><th class="num">B/splat</th><th class="num">total</th><th>contents</th></tr>${sizes}</table>
        <div class="kv" style="margin-top:6px">Course pipeline (unit 3/5): LGM emits 4·64² = <b>16 384</b> splats (small) or 4·128² = <b>65 536</b> (big) —
        i.e. ≈0.9 / 3.7 MB at 14 floats. Photo-trained scenes reach millions of splats, which is why editors prune and quantise.</div>
      </div></div>
    <div class="stack">
      <div class="card"><header>Where splats stop being the right tool</header>
        <div class="body stack">
          <div class="kv"><b>No watertight surface.</b> Collision, CAD, 3D printing, UV/texture work still want a mesh — hence splat→mesh converters (course unit 4).</div>
          <div class="kv"><b>Storage scales with detail, not with topology.</b> A flat wall costs as many splats as a furry one of equal screen detail.</div>
          <div class="kv"><b>View-dependent effects</b> need spherical harmonics (48 extra floats/splat) or a network on top.</div>
          <div class="kv"><b>Artifacts are fuzzy,</b> not cracked: floaters, needles, "splat soup" under large viewpoint change.</div>
        </div></div>
      <div class="card"><header>Lineage in one line</header>
        <div class="body kv">Surface splatting (Zwicker et al. 2001) → EWA splatting (2002) → differentiable point rendering (diff. renderer line of work)
        → <b>3D Gaussian Splatting</b> (Kerbl et al., SIGGRAPH 2023) → feed-forward generators like <b>LGM</b> (2024) that skip per-scene training.
        The projection math on this page is the 2001/2002 EWA formula, unchanged.</div></div>
    </div>
  </div>`;
  p.querySelector("input[data-v=n]").addEventListener("input", (e) => { V5.n = Math.round(Math.pow(10, +e.target.value)); RENDER.vs(); });
};

/* ================= boot ================= */
const initial = location.hash.slice(1);
if (initial && RENDER[initial]) {
  const btn = document.querySelector(`.tab[data-tab="${initial}"]`);
  if (btn) btn.dispatchEvent(new MouseEvent("click", { bubbles: true }));
} else {
  RENDER.anatomy();
}

</script>
</body>
</html>
